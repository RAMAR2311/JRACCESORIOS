<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR ACCESORIOS - Sin Conexión</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v=jr_accesorios_v1">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/icons/favicon-32x32.png?v=jr_accesorios_v1">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/icons/favicon-16x16.png?v=jr_accesorios_v1">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/icons/apple-touch-icon.png?v=jr_accesorios_v1">
    <meta name="theme-color" content="#8D4925">
    <!-- Google Fonts: Montserrat & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --brand-bg: #FFFFFF;
            --brand-white: #FFFFFF;
            --brand-primary: #8D4925;
            --brand-primary-dark: #6F4E37;
            --brand-secondary: #2C1E1A;
            --brand-text: #1C1615;
            --brand-muted: #5D4037;
            --brand-border: #EFEBE9;
            --brand-shadow: 0 4px 18px rgba(111, 78, 55, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--brand-bg);
            color: var(--brand-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .offline-card {
            background: var(--brand-white);
            border: 1px solid var(--brand-border);
            border-radius: 20px;
            box-shadow: var(--brand-shadow);
            padding: 2.5rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .offline-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(135deg, #8D4925 0%, #6F4E37 100%);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(141, 73, 37, 0.08);
            color: #8D4925;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(141, 73, 37, 0.25);
        }

        .icon-container {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: rgba(196, 164, 130, 0.18);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            color: var(--brand-primary);
            font-size: 2.25rem;
            border: 1px solid #EFEBE9;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--brand-secondary);
            margin-bottom: 0.75rem;
            letter-spacing: 0.02em;
        }

        p {
            color: var(--brand-muted);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 1.75rem;
        }

        .btn-retry {
            background: linear-gradient(135deg, #8D4925 0%, #6F4E37 100%);
            color: #FFFFFF;
            border: 1px solid #8D4925;
            padding: 0.85rem 1.75rem;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(141, 73, 37, 0.25);
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #6F4E37 0%, #2C1E1A 100%);
            box-shadow: 0 6px 20px rgba(111, 78, 55, 0.35);
        }

        .status-pill {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--brand-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #B91C1C;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div style="margin-bottom: 1rem;">
            <img src="/static/img/icons/icon-192x192.png?v=jr_accesorios_v1" alt="JR ACCESORIOS Logo" style="width: 80px; height: 80px; object-fit: contain; border-radius: 16px; box-shadow: 0 4px 12px rgba(111,78,55,0.08); padding: 4px; border: 1px solid #EFEBE9; background: #FFFFFF;">
        </div>
        <div class="brand-badge">
            <i class="fas fa-bolt"></i> JR ACCESORIOS POS
        </div>
        <div class="icon-container">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h1>Sin Conexión a Internet</h1>
        <p>
            No pudimos sincronizar con el servidor de JR ACCESORIOS. Por favor verifica tu conexión Wi-Fi o datos móviles.
        </p>
        <button class="btn-retry" onclick="window.location.reload();">
            <i class="fas fa-rotate-right"></i> Reintentar Conexión
        </button>
        <div class="status-pill">
            <span class="status-dot"></span> Modo Fuera de Línea
        </div>
    </div>

    <script>
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
